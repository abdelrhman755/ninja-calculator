<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuronami calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="tit"> <span>Kuronami</span> Calculator</h1>
        <div class="calculator">
            <input type="text" id="inputbox"  placeholder="0" class="inp-box">
            <div>
                <button class="tpop">AC</button>
                <button class="tpop">DEL</button>
                <button class="tpop">%</button>
                <button class="divoperator">/</button>
            </div>
            <div>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operators">*</button>
            </div>
            <div>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operators">-</button>
            </div>
            <div>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operators">+</button>
            </div>
            <div>
                <button>00</button>
                <button>0</button>
                <button class="dot">.</button>
                <button class="equalbtn">=</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
